<!DOCTYPE html>
<html>
    <body>
        {% block content %}{% endblock %}

        {% if user.is_authenticated %}
            <p>Welcome, {{ user.username }}!
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </body>
</html>
